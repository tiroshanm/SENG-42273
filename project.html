        const ONTOLOGY_SOLUTION = `@prefix : <http://example.org/movie#> .
@prefix rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#> .
@prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#> .
@prefix owl: <http://www.w3.org/2002/07/owl#> .
@prefix xsd: <http://www.w3.org/2001/XMLSchema#> .

# CLASSES
:Movie a rdfs:Class ; rdfs:label "Movie" .
:Person a rdfs:Class ; rdfs:label "Person" .
:Director a rdfs:Class ; rdfs:subClassOf :Person ; rdfs:label "Director" .
:Actor a rdfs:Class ; rdfs:subClassOf :Person ; rdfs:label "Actor" .
:Genre a rdfs:Class ; rdfs:label "Genre" .

:directedBy a rdf:Property, owl:FunctionalProperty ;

:directed a rdf:Property ; rdfs:domain :Director ; rdfs:range :Movie .

        const DBPEDIA_QUERIES = {
            basic: `# Find movies by Christopher Nolan
PREFIX dbo: <http://dbpedia.org/ontology/>
PREFIX dbr: <http://dbpedia.org/resource/>
PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>

SELECT ?movie ?title ?year
WHERE {
    ?movie dbo:director dbr:Christopher_Nolan .
    ?movie rdfs:label ?title .
    OPTIONAL { ?movie dbo:releaseDate ?date }
    BIND(YEAR(?date) AS ?year)
    FILTER(LANG(?title) = "en")
}
LIMIT 20`,
            detailed: `# Detailed movie info with budget
PREFIX dbo: <http://dbpedia.org/ontology/>
PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
PREFIX foaf: <http://xmlns.com/foaf/0.1/>

SELECT ?movie ?title ?directorName ?budget
WHERE {
    ?movie a dbo:Film .
    ?movie rdfs:label ?title .
    ?movie dbo:director ?director .
    ?director foaf:name ?directorName .
    OPTIONAL { ?movie dbo:budget ?budget }
    FILTER(LANG(?title) = "en")
    FILTER(?budget > 100000000)

ORDER BY DESC(?budget)
LIMIT 30`,

PREFIX dbo: <http://dbpedia.org/ontology/>

        const ANALYTICS = {

        function parseTriples(text) {
            const triples = [], prefixes = {};
            text.match(/@prefix\s+(\w*):?\s*<([^>]+)>\s*\./g)?.forEach(m => {
                const [, p, u] = m.match(/@prefix\s+(\w*):?\s*<([^>]+)>/);
                prefixes[p || ''] = u;
            });
            let subj = null, pred = null;
            text.split('\n').forEach(line => {
                line = line.trim();
                if (!line || line.startsWith('#') || line.startsWith('@')) return;
                const match = line.match(/^(\S+)\s+(\S+)\s+(.+?)\s*[.;,]?\s*$/);
                if (match) {
                    let [, s, p, o] = match;
                    if (s !== ';' && s !== ',') subj = s;
                    if (p && p !== ';') pred = p;
                    if (subj && pred && o) {
                        o = o.replace(/[.;,]\s*$/, '').trim();
                        o.split(/\s*,\s*/).forEach(obj => obj.trim() && triples.push({ subject: subj, predicate: pred, object: obj.trim() }));
                    }
                }
            });
            return { triples, prefixes };
        }

        function validateOntology(code) {
            const checks = [
                { name: "Has @prefix declarations", test: () => code.includes('@prefix') },
                { name: "Defines :Director class", test: () => code.includes(':Director') && code.includes('rdfs:Class') },
                { name: "Defines :Actor class", test: () => code.includes(':Actor') && code.includes('rdfs:Class') },
                { name: "Defines :Genre class", test: () => code.includes(':Genre') },
                { name: "Uses rdfs:subClassOf", test: () => code.includes('rdfs:subClassOf') },
                { name: "Has :directedBy property", test: () => code.includes(':directedBy') },
                { name: "Has :starring property", test: () => code.includes(':starring') },
                { name: "Uses rdfs:domain", test: () => code.includes('rdfs:domain') },
                { name: "Uses rdfs:range", test: () => code.includes('rdfs:range') },
                { name: "Has owl:inverseOf", test: () => code.includes('owl:inverseOf') }
            ];
            const results = checks.map(c => ({ ...c, passed: c.test() }));
            return { results, score: Math.round(results.filter(r => r.passed).length / checks.length * 100) };
        }

                const node = g.append('g').selectAll('g').data(graph.nodes).join('g').style('cursor','pointer')
                    .call(d3.drag().on('start',(e,d)=>{if(!e.active)sim.alphaTarget(0.3).restart();d.fx=d.x;d.fy=d.y;})
                    .on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y;}).on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null;}));
                node.append('circle').attr('r',22).attr('fill',d=>colors[d.type]).attr('stroke','white').attr('stroke-width',3);
                node.append('text').attr('dy',40).attr('text-anchor','middle').attr('font-size',11).attr('font-weight',500).attr('fill','#475569').text(d=>d.label);
                sim.on('tick',()=>{link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);node.attr('transform',d=>`translate(${d.x},${d.y})`);});
                return () => sim.stop();
            }, [graph]);

            return (
                <div className="fade-in">
                    <h2 style={{fontSize:'1.5rem',fontWeight:700,color:'#1e293b',marginBottom:'0.5rem'}}>{p.icon} Phase 7: {p.title}</h2>
                    <p style={{color:'#64748b',marginBottom:'2rem'}}>Build an interactive knowledge graph visualization.</p>

                    <div className="card">
                        <div className="card-header" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                            <span>🌐 Knowledge Graph Visualization</span>
                            <button onClick={generate} className="btn btn-primary" style={{padding:'0.375rem 1rem',fontSize:'0.875rem'}}>Generate Graph</button>
                        </div>
                        <div className="card-body">
                            <svg ref={ref} className="graph-container"></svg>
                            <div className="graph-legend">
                                <div className="legend-item"><span className="legend-dot" style={{background:'#3b82f6'}}></span>Movie</div>
                                <div className="legend-item"><span className="legend-dot" style={{background:'#10b981'}}></span>Director</div>
                                <div className="legend-item"><span className="legend-dot" style={{background:'#f59e0b'}}></span>Actor</div>
                                <div className="legend-item"><span className="legend-dot" style={{background:'#a855f7'}}></span>Genre</div>
                            </div>
                        </div>
                    </div>

                    <div className="info-box success">
                        <h4>🎉 Congratulations!</h4>
                        <p>You've completed the hands-on project! You now have practical experience with:</p>
                        <ul style={{marginLeft:'1.5rem',marginTop:'0.5rem'}}>
                            <li>Designing ontologies with RDFS and OWL</li>
                            <li>Querying real Linked Data from DBpedia</li>
                            <li>Creating and validating RDF datasets</li>
                            <li>Understanding semantic reasoning and inference</li>
                            <li>Writing analytical SPARQL queries</li>
                            <li>Visualizing knowledge graphs</li>
                        </ul>
                    </div>

                    <div className="card">
                        <div className="card-header">🚀 Next Steps & Resources</div>
                        <div className="card-body">
                            <div className="resource-links">
                                <a href="https://protege.stanford.edu/" target="_blank" className="resource-link">🦉 Protégé (OWL Editor)</a>
                                <a href="https://jena.apache.org/" target="_blank" className="resource-link">⚙️ Apache Jena (Java)</a>
                                <a href="https://rdflib.readthedocs.io/" target="_blank" className="resource-link">🐍 RDFLib (Python)</a>
                                <a href="https://graphdb.ontotext.com/" target="_blank" className="resource-link">🗄️ GraphDB</a>
                            </div>
                        </div>
                    </div>

                    <div className="step-nav"><div></div><button onClick={onDone} className="btn btn-success">✓ Complete Project</button></div>
                </div>
            );
        }

        function App() {
            const [phase, setPhase] = useState(1);
            const [done, setDone] = useState([]);
            const complete = id => { if (!done.includes(id)) setDone([...done, id]); if (id < PHASES.length) setPhase(id + 1); };
            const render = () => {
                switch(phase) {
                    case 1: return <Phase1 onDone={() => complete(1)} />;
                    case 2: return <Phase2 onDone={() => complete(2)} />;
                    case 3: return <Phase3 onDone={() => complete(3)} />;
                    case 4: return <Phase4 onDone={() => complete(4)} />;
                    case 5: return <Phase5 onDone={() => complete(5)} />;
                    case 6: return <Phase6 onDone={() => complete(6)} />;
                    case 7: return <Phase7 onDone={() => complete(7)} />;
                    default: return null;
                }
            };
            return (
                <div>
                    <Header />
                    <Hero />
                    <div className="main-layout">
                        <Sidebar phase={phase} setPhase={setPhase} done={done} />
                        <main className="content"><div className="content-inner">{render()}</div></main>
                    </div>
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
