                        title: 'RDF Basics: Triples',
                        content: `# RDF: Resource Description Framework

RDF is the fundamental data model of the Semantic Web. It represents information as **triples** - statements consisting of three parts:

## The Triple Structure

\`\`\`
Subject → Predicate → Object
\`\`\`

- **Subject**: The resource being described (URI or blank node)
- **Predicate**: The property or relationship (always a URI)
- **Object**: The value (URI, blank node, or literal)

## Example

\`\`\`turtle
@prefix ex: <http://example.org/> .

ex:JohnDoe ex:hasName "John Doe" .
ex:JohnDoe ex:worksAt ex:AcmeCorp .
ex:JohnDoe ex:age 30 .
\`\`\`

This creates three statements about John Doe:
1. His name is "John Doe" (literal)
2. He works at Acme Corp (resource)
3. His age is 30 (typed literal)`,
                        example: `@prefix ex: <http://example.org/> .
@prefix foaf: <http://xmlns.com/foaf/0.1/> .

# Describing a person
ex:alice a foaf:Person ;
    foaf:name "Alice Smith" ;
    foaf:age 28 ;
    foaf:knows ex:bob .

ex:bob a foaf:Person ;
    foaf:name "Bob Johnson" ;
    foaf:mbox <mailto:bob@example.org> .`
                    },

                        content: `# RDF Serialization Formats

RDF data can be serialized in multiple formats:

## Turtle (Terse RDF Triple Language)
Human-readable, compact syntax using prefixes.

## N-Triples
Simple line-based format, one triple per line.

## RDF/XML
XML-based format, verbose but widely supported.

## JSON-LD
JSON-based format, good for web applications.

## Key Turtle Syntax

- **@prefix**: Define namespace shortcuts
- **;** (semicolon): Same subject, new predicate-object
- **,** (comma): Same subject and predicate, new object
- **.** (period): End of statement
- **a**: Shorthand for rdf:type`,

@prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#> .

                        content: `# RDFS: RDF Schema

RDFS extends RDF with vocabulary for describing schemas:

## Core Concepts

### Classes (rdfs:Class)
Define categories of resources.

### Properties (rdf:Property)
Define relationships between resources.

### Key RDFS Properties

- **rdfs:subClassOf**: Class hierarchy
- **rdfs:subPropertyOf**: Property hierarchy
- **rdfs:domain**: Subject type restriction
- **rdfs:range**: Object type restriction
- **rdfs:label**: Human-readable name
- **rdfs:comment**: Description`,

# Define classes

    rdfs:label "Person" .

ex:Student a rdfs:Class ;
    rdfs:subClassOf ex:Person .

# Define properties
ex:teaches a rdf:Property ;

    rdfs:range ex:Course .`
                    },

                        id: 'rdfs-inference',

                        content: `# RDFS Inference

RDFS enables reasoning through entailment rules:

## Key Inference Rules

### 1. Subclass Transitivity
If A subClassOf B and B subClassOf C, then A subClassOf C.

### 2. Type Propagation
If x is type A and A subClassOf B, then x is type B.

### 3. Domain Inference
If P has domain C and x P y, then x is type C.

### 4. Range Inference
If P has range C and x P y, then y is type C.`,
                        example: `@prefix rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#> .
@prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#> .

# Class hierarchy
ex:Animal rdfs:subClassOf ex:LivingThing .
ex:Dog rdfs:subClassOf ex:Animal .

# Instance
ex:buddy a ex:Dog .

# Inferred: ex:buddy is also Animal and LivingThing`

OWL extends RDFS with more expressive constructs:

## Property Characteristics

- **owl:FunctionalProperty**: At most one value
- **owl:TransitiveProperty**: a→b→c implies a→c
- **owl:SymmetricProperty**: a→b implies b→a
- **owl:inverseOf**: Reverse relationship

## Class Expressions

- **owl:intersectionOf**: AND of classes
- **owl:unionOf**: OR of classes
- **owl:complementOf**: NOT of a class`,

## Open World Assumption

Unlike databases, OWL uses OWA:
- Missing information ≠ False
- Explicit negation required

## Reasoning Tasks

1. **Consistency Checking**: Is the ontology contradiction-free?
2. **Classification**: Compute class hierarchy
3. **Realization**: Find most specific classes for instances`,

# Disjoint classes
ex:Male a owl:Class .
ex:Female a owl:Class .
ex:Male owl:disjointWith ex:Female .

# Instance
ex:john a ex:Male ;
    ex:hasChild ex:mary .

# Reasoner infers: john is a Parent`

## Query Forms

- **SELECT**: Return variable bindings
- **CONSTRUCT**: Create new RDF graph
- **ASK**: Return boolean (yes/no)
- **DESCRIBE**: Return resource description

## Basic Structure

\`\`\`sparql
PREFIX ex: <http://example.org/>
SELECT ?variable
WHERE {
    ?s ?p ?o .
}
\`\`\``,
                        example: `PREFIX foaf: <http://xmlns.com/foaf/0.1/>

                    },

                        content: `# Advanced SPARQL Features

## OPTIONAL
Include results even if pattern doesn't match.

## FILTER
Constrain results with conditions.

## UNION
Combine multiple patterns.

## Aggregates
COUNT, SUM, AVG, MIN, MAX with GROUP BY.`,

            foaf:age ?age .
    
    OPTIONAL { ?person foaf:mbox ?email }
    
    FILTER(?age > 25)
}
ORDER BY DESC(?age)`

        const SAMPLE_DATA = `@prefix rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#> .

        // ==================== UTILITIES ====================

        function parseTriples(text) {
            const triples = [];
            const prefixes = {};
            
            const prefixRegex = /@prefix\s+(\w+):\s*<([^>]+)>\s*\./g;
            let match;
            while ((match = prefixRegex.exec(text)) !== null) {
                prefixes[match[1]] = match[2];
            }
            
            const lines = text.split('\n');
            let currentSubject = null;
            let currentPredicate = null;
            
            for (const line of lines) {
                const trimmed = line.trim();
                if (!trimmed || trimmed.startsWith('#') || trimmed.startsWith('@')) continue;
                
                const parts = trimmed.match(/^(\S+)\s+(\S+)\s+(.+?)\s*[.;,]?\s*$/);
                if (parts) {
                    let [, s, p, o] = parts;
                    if (s !== ';' && s !== ',') currentSubject = s;
                    if (p && p !== ';') currentPredicate = p;
                    if (currentSubject && currentPredicate && o) {
                        o = o.replace(/[.;,]\s*$/, '').trim();
                        const objects = o.split(/\s*,\s*/);
                        for (const obj of objects) {
                            if (obj.trim()) {
                                triples.push({
                                    subject: currentSubject,
                                    predicate: currentPredicate,
                                    object: obj.trim()
                                });
                            }
                        }
                    }
                }
            }
            
            return { triples, prefixes };
        }

        function executeSparql(query, triples) {
            const selectMatch = query.match(/SELECT\s+(.+?)\s+WHERE/i);
            if (!selectMatch) return { error: "Invalid query" };
            
            const variables = selectMatch[1].match(/\?\w+/g) || [];
            const whereMatch = query.match(/WHERE\s*\{([^}]+)\}/i);
            if (!whereMatch) return { error: "No WHERE clause" };
            
            const results = [];
            const patterns = whereMatch[1].trim().split(/\s*\.\s*/).filter(p => p.trim());
            
            for (const pattern of patterns) {
                if (!pattern.trim() || pattern.includes('OPTIONAL') || pattern.includes('FILTER')) continue;
                
                const parts = pattern.trim().split(/\s+/);
                if (parts.length >= 3) {
                    const [s, p, ...rest] = parts;
                    const o = rest.join(' ');
                    
                    for (const triple of triples) {
                        const binding = {};
                        let matches = true;
                        
                        if (s.startsWith('?')) binding[s] = triple.subject;
                        else if (s !== triple.subject) matches = false;
                        
                        if (p.startsWith('?')) binding[p] = triple.predicate;
                        else if (p !== triple.predicate && !p.includes(triple.predicate.split(':')[1])) matches = false;
                        
                        if (o.startsWith('?')) binding[o] = triple.object;
                        else if (o !== triple.object) matches = false;
                        
                        if (matches && Object.keys(binding).length > 0) {
                            results.push(binding);
                        }
                    }
                }
            }
            
            return { variables, results: results.slice(0, 20), count: results.length };
        }

        function GraphVisualizer() {
            const svgRef = useRef(null);
            const [code, setCode] = useState(SAMPLE_DATA);
            const [nodes, setNodes] = useState([]);
            const [links, setLinks] = useState([]);

            function generateGraph() {
                const { triples } = parseTriples(code);
                const nodeMap = new Map();
                const linkList = [];

                triples.forEach(({ subject, predicate, object }) => {
                    if (!nodeMap.has(subject)) {
                        nodeMap.set(subject, {
                            id: subject,
                            label: subject.split(':')[1] || subject,
                            type: 'resource'
                        });
                    }

                    const isLiteral = object.startsWith('"');
                    if (!nodeMap.has(object)) {
                        nodeMap.set(object, {
                            id: object,
                            label: isLiteral ? object.replace(/"/g, '') : (object.split(':')[1] || object),
                            type: isLiteral ? 'literal' : 'resource'
                        });
                    }

                    linkList.push({
                        source: subject,
                        target: object,
                        label: predicate.split(':')[1] || predicate
                    });
                });

                setNodes(Array.from(nodeMap.values()));
                setLinks(linkList);
            }

            useEffect(() => {
                if (nodes.length === 0 || !svgRef.current) return;

                const svg = d3.select(svgRef.current);
                svg.selectAll('*').remove();

                const width = svgRef.current.clientWidth;
                const height = svgRef.current.clientHeight;

                const g = svg.append('g');

                svg.call(d3.zoom().on('zoom', (event) => {
                    g.attr('transform', event.transform);
                }));

                svg.append('defs').append('marker')
                    .attr('id', 'arrowhead')
                    .attr('viewBox', '-0 -5 10 10')
                    .attr('refX', 25)
                    .attr('refY', 0)
                    .attr('orient', 'auto')
                    .attr('markerWidth', 6)
                    .attr('markerHeight', 6)
                    .append('path')
                    .attr('d', 'M 0,-5 L 10,0 L 0,5')
                    .attr('fill', '#94a3b8');

                const simulation = d3.forceSimulation(nodes)
                    .force('link', d3.forceLink(links).id(d => d.id).distance(150))
                    .force('charge', d3.forceManyBody().strength(-500))
                    .force('center', d3.forceCenter(width / 2, height / 2))
                    .force('collision', d3.forceCollide().radius(60));

                const link = g.append('g')
                    .selectAll('line')
                    .data(links)
                    .join('line')
                    .attr('stroke', '#94a3b8')
                    .attr('stroke-width', 2)
                    .attr('marker-end', 'url(#arrowhead)');

                const linkLabel = g.append('g')
                    .selectAll('text')
                    .data(links)
                    .join('text')
                    .attr('font-size', 10)
                    .attr('fill', '#64748b')
                    .attr('text-anchor', 'middle')
                    .text(d => d.label);

                const node = g.append('g')
                    .selectAll('g')
                    .data(nodes)
                    .join('g')
                    .style('cursor', 'pointer')
                    .call(d3.drag()
                        .on('start', (event, d) => {
                            if (!event.active) simulation.alphaTarget(0.3).restart();
                            d.fx = d.x;
                            d.fy = d.y;
                        })
                        .on('drag', (event, d) => {
                            d.fx = event.x;
                            d.fy = event.y;
                        })
                        .on('end', (event, d) => {
                            if (!event.active) simulation.alphaTarget(0);
                            d.fx = null;
                            d.fy = null;
                        })
                    );

                node.append('circle')
                    .attr('r', 20)
                    .attr('fill', d => d.type === 'literal' ? '#fbbf24' : '#3b82f6')
                    .attr('stroke', '#fff')
                    .attr('stroke-width', 2);

                node.append('text')
                    .attr('dy', 35)
                    .attr('text-anchor', 'middle')
                    .attr('font-size', 11)
                    .attr('fill', '#334155')
                    .text(d => d.label.length > 15 ? d.label.slice(0, 15) + '...' : d.label);

                simulation.on('tick', () => {
                    link
                        .attr('x1', d => d.source.x)
                        .attr('y1', d => d.source.y)
                        .attr('x2', d => d.target.x)
                        .attr('y2', d => d.target.y);

                    linkLabel
                        .attr('x', d => (d.source.x + d.target.x) / 2)
                        .attr('y', d => (d.source.y + d.target.y) / 2);

                    node.attr('transform', d => `translate(${d.x},${d.y})`);
                });

                return () => simulation.stop();
            }, [nodes, links]);

            return (
                <div className="p-6 flex-col full-height">
                    <div className="flex-row gap-4 mb-4">
                        <div className="flex-1">
                            <div className="code-editor" style={{height: '120px'}}>
                                <textarea
                                    value={code}
                                    onChange={(e) => setCode(e.target.value)}
                                    placeholder="Enter RDF/Turtle to visualize..."
                                    style={{height: '100%'}}
                                />
                            </div>
                        </div>
                        <button onClick={generateGraph} className="btn btn-primary" style={{padding: '0.5rem 1.5rem'}}>
                            Visualize 🔗
                        </button>
                    </div>

                    <div className="card flex-1 overflow-hidden">
                        <svg ref={svgRef} className="graph-container"></svg>
                    </div>

                    <div className="graph-legend">
                        <div className="legend-item">
                            <div className="legend-dot resource"></div>
                            Resource (URI)
                        </div>
                        <div className="legend-item">
                            <div className="legend-dot literal"></div>
                            Literal
                        </div>
                        <span style={{marginLeft: 'auto', color: '#94a3b8'}}>Drag nodes • Scroll to zoom</span>
                    </div>
                </div>
            );
        }

        function QuizView({ module, onQuizComplete }) {
            const [qIdx, setQIdx] = useState(0);
            const [selected, setSelected] = useState(null);
            const [showResult, setShowResult] = useState(false);
            const [score, setScore] = useState(0);
            const [completed, setCompleted] = useState(false);

            const questions = QUIZ_DATA[module] || [];
            const question = questions[qIdx];

            function handleSubmit() {
                if (selected === null) return;
                if (selected === question.correct) {
                    setScore(s => s + 1);
                }
                setShowResult(true);
            }

            function handleNext() {
                if (qIdx < questions.length - 1) {
                    setQIdx(q => q + 1);
                    setSelected(null);
                    setShowResult(false);
                } else {
                    setCompleted(true);
                    onQuizComplete(module, score + (selected === question.correct ? 1 : 0), questions.length);
                }
            }

            function retry() {
                setQIdx(0);
                setSelected(null);
                setShowResult(false);
                setScore(0);
                setCompleted(false);
            }

            if (questions.length === 0) {
                return (
                    <div className="full-height empty-state">
                        <p>No quiz available for this module yet.</p>
                    </div>

            const [query, setQuery] = useState(`PREFIX foaf: <http://xmlns.com/foaf/0.1/>

SELECT ?person ?name ?age
WHERE {
    ?person a foaf:Person .
    ?person foaf:name ?name .
    ?person foaf:age ?age .
}`);
            const [results, setResults] = useState(null);
            const [error, setError] = useState(null);

            function execute() {
                try {
                    setError(null);
                    const { triples } = parseTriples(data);
                    const r = executeSparql(query, triples);
                    if (r.error) {
                        setError(r.error);
                    } else {
                        setResults(r);
                    }
                } catch (e) {
                    setError(e.message);
                }
            }

            return (
                <div className="p-6 grid-2 full-height">
                    <div className="flex-col gap-4">
                        <div className="flex-1 flex-col">
                            <div className="flex-row justify-between items-center mb-2">
                                <h3 className="font-semibold text-slate-700">RDF Data</h3>
                                <button onClick={() => setData(SAMPLE_DATA)} className="text-sm text-blue-600" style={{background:'none',border:'none',cursor:'pointer'}}>
                                    Reset
                                </button>
                            </div>
                            <div className="code-editor flex-1">
                                <textarea
                                    value={data}
                                    onChange={(e) => setData(e.target.value)}
                                    style={{height: '100%', fontSize: '0.75rem'}}
                                />
                            </div>
                        </div>

                        <div className="flex-1 flex-col">
                            <h3 className="font-semibold text-slate-700 mb-2">SPARQL Query</h3>
                            <div className="code-editor flex-1">
                                <textarea
                                    value={query}
                                    onChange={(e) => setQuery(e.target.value)}
                                    style={{height: '100%'}}
                                />
                            </div>
                        </div>

                        <button onClick={execute} className="btn btn-success" style={{padding: '0.75rem', width: '100%'}}>
                            Execute Query ▶
                        </button>
                    </div>

                    <div className="flex-col">
                        <h3 className="font-semibold text-slate-700 mb-2">Results</h3>
                        <div className="card flex-1 overflow-auto">
                            {error && (
                                <div className="p-4 alert alert-error">
                                    <strong>Error:</strong> {error}
                                </div>
                            )}

                            {results && (
                                <div className="p-4">
                                    <div className="text-sm text-slate-500 mb-4">
                                        Found {results.count} result(s)
                                    </div>
                                    
                                    {results.results.length > 0 ? (
                                        <table className="data-table">
                                            <thead>
                                                <tr>
                                                    {results.variables.map(v => (
                                                        <th key={v}>{v}</th>
                                                    ))}
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {results.results.map((row, idx) => (
                                                    <tr key={idx}>
                                                        {results.variables.map(v => (
                                                            <td key={v}>{row[v] || '-'}</td>
                                                        ))}
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    ) : (
                                        <p className="text-slate-500">No matching results.</p>
                                    )}
                                </div>
                            )}

                            {!results && !error && (
                                <div className="empty-state">
                                    <div>
                                        <div className="empty-icon">🔍</div>
                                        <p>Execute a query to see results</p>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const [activeModule, setActiveModule] = useState('rdf');
            const [activeView, setActiveView] = useState('learn');
            const [completedLessons, setCompletedLessons] = useState([]);
            const [quizScores, setQuizScores] = useState({});

            function handleLessonComplete(lessonId) {
                if (!completedLessons.includes(lessonId)) {
                    setCompletedLessons([...completedLessons, lessonId]);
                }
            }

            function handleQuizComplete(module, score, total) {
                setQuizScores({ ...quizScores, [module]: { score, total } });
            }

            function calculateProgress() {
                const totalLessons = Object.values(MODULES).reduce((acc, m) => acc + m.lessons.length, 0);
                const totalQuizzes = Object.keys(QUIZ_DATA).length;
                const lessonProgress = (completedLessons.length / totalLessons) * 50;
                const quizProgress = (Object.keys(quizScores).length / totalQuizzes) * 50;
                return Math.round(lessonProgress + quizProgress);
            }

            function renderView() {
                switch (activeView) {
                    case 'learn':
                        return <LearnView module={activeModule} onComplete={handleLessonComplete} completedLessons={completedLessons} />;
                    case 'practice':
                        return <PracticeEditor module={activeModule} />;
                    case 'visualize':
                        return <GraphVisualizer />;
                    case 'quiz':
                        return <QuizView module={activeModule} onQuizComplete={handleQuizComplete} />;
                    case 'sparql':
                        return <SparqlPlayground />;
                    default:
                        return null;
                }
            }

            return (
                <div>
                    <Navigation 
                        activeModule={activeModule}
                        setActiveModule={setActiveModule}
                        setActiveView={setActiveView}
                        progress={calculateProgress()}
                    />
                    
                    <div className="main-layout">
                        <Sidebar 
                            activeModule={activeModule}
                            activeView={activeView}
                            setActiveView={setActiveView}
                            completedLessons={completedLessons}
                        />
                        
                        <main className="main-content">
                            {renderView()}
                        </main>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
